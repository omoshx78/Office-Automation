databases:
  - name: office-automation-db
    plan: free

services:
  - type: web
    name: office-automation-backend
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PDF_SERVICE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SUPERADMIN_USERNAME
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: office-automation-db
          property: connectionString
      - key: PORT
        value: 3001
